name: Build Android APK

# Builds an installable Android APK in the cloud and publishes it to a GitHub
# Release, so it can be downloaded and installed straight onto a phone — no
# local computer or developer accounts required.

on:
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'vercel.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npx expo prebuild --platform android --no-install

      - name: Pin Kotlin version (Compose compiler compatibility)
        # React Native 0.76 pins the Kotlin compiler to 1.9.24. Expo's default
        # ext is 1.9.25, which makes expo-modules-core pick Compose compiler
        # 1.5.15 (requires 1.9.25) and clash with the 1.9.24 compiler. Pin to
        # 1.9.24 so Compose resolves to 1.5.14 and matches.
        run: echo "android.kotlinVersion=1.9.24" >> android/gradle.properties

      - name: Build release APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/nearby.apk
          ls -lh out

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nearby-apk
          path: out/nearby.apk

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: Nearby — Android preview
          prerelease: true
          body: |
            Latest Android preview build of **Nearby** (V1, mock data).

            **Install on your phone:**
            1. Tap **nearby.apk** below to download it.
            2. Open the downloaded file. Android will ask to allow installing
               from this source — tap **Settings → allow**, then **Install**.
            3. Open the **Nearby** app.

            > The map screen shows blank tiles until a Google Maps API key is
            > added (repo secret `GOOGLE_MAPS_API_KEY`). Everything else works.
          files: out/nearby.apk
