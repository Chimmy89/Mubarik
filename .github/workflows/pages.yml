name: Deploy Web to GitHub Pages

# Builds the Expo web export and publishes it to GitHub Pages, giving a public
# URL that opens in any phone browser — no app install, no account needed.
# (Pages must be enabled once: Settings → Pages → Source: GitHub Actions.)

on:
  workflow_dispatch:
  push:
    # Pages' github-pages environment only allows deploys from the repo's
    # default branch, so we trigger from it (not main) to avoid rejected runs.
    branches: [claude/local-happenings-platform-BnIcC]
    paths-ignore:
      - 'README.md'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically if it isn't already.
          enablement: true

      - name: Build web export
        env:
          # Serve correctly from the Pages sub-path (e.g. /Mubarik/).
          EXPO_WEB_BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: npx expo export -p web

      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
